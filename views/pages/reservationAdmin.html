<!DOCTYPE html>
<html data-theme="light" lang="it">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<link href="../assets/logo_white.png" rel="icon" />
		<meta name="description" content="SportLab - Pagina di prenotazione" />
		<meta name="language" content="it" />
		<title>Prenotazioni - SportLab</title>
		<link href="../style/style.css" rel="stylesheet" />
		<link href="../style/reservation.css" rel="stylesheet" />
		<link href="../style/header.css" rel="stylesheet" />
		<link href="../style/footer.css" rel="stylesheet" />
        <script src="../scripts/reservationAdmin.js"></script>
	</head>
	<body>
	
        <<-HEADER->>
        
        <nav id="breadcrumb">
            <p>Ti trovi in: <span class="breadcrumb-page">Prenotazioni Admin</span></p>
        </nav>

        <main id="main-content" tabindex="-1">
            <div class="filters">
            <div class="filter-group">
                <label for="searchName">Nome o cognome cliente</label>
                <input type="text" id="searchName" placeholder="Nome cliente" onkeyup="filterTable()" />
            </div>
            <div class="filter-group">
                <label for="filterSport">Sport</label>
                <select id="filterSport" onchange="changeSport()">
                    <option value="">Tutti</option>
                    [sports]
                </select>
            </div>
            <div class="filter-group">
                <label for="filterCourt">Campo</label>
                <select id="filterCourt" onchange="filterTable()">
                    <option value="">Tutti</option>
                    [courts]
                </select>
            </div>
            <div class="filter-group">
                <label for="filterDate">Data</label>
                <input type="date" id="filterDate" onchange="filterTable()" />
            </div>
            <button class="filter-button" onclick="resetFilters()">Resetta filtri</button>
        </div>
    </form>
        <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>Cliente</th>
                            <th>Sport</th>
                            <th>Campo</th>
                            <th>Data</th>
                            <th>Orario</th>
                            <th>Prezzo</th>
                            <th>Azioni</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody">
                        [adminReservations]
                    </tbody>
                </table>
            </div>
        </div>
        </main>

        <div class="overlay" id="dialogDelete">
            <div class="dialog">
                <div class="dialog-icon">⚠️</div>
                <h3>Conferma Eliminazione</h3>
                <p>Sei sicuro di voler eliminare questa prenotazione? Questa azione non può essere annullata.</p>
                <div class="dialog-actions">
                    <button class="btn btn-dl-cancel" onclick="closeDeleteDialog()">Annulla</button>
                    <button class="btn btn-dl-delete" onclick="deleteReservation()">Elimina</button>
                </div>
            </div>
        </div>

        <!-- Dialog Modifica Prenotazione -->
    <div class="dialog-overlay" id="editDialog">
        <div class="dialog-box dialog-edit">
            <div class="dialog-header">
                <h2>Modifica Prenotazione</h2>
            </div>
            <div class="dialog-content">
                <form id="editForm">
                    <div class="form-group">
                        <label for="editCliente">Cliente</label>
                        <input type="text" id="editCliente" required>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="editSport">Sport</label>
                            <select id="editSport" required>
                                <option value="Tennis">Tennis</option>
                                <option value="Calcetto">Calcetto</option>
                                <option value="Padel">Padel</option>
                                <option value="Basket">Basket</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="editCampo">Campo</label>
                            <input type="text" id="editCampo" required>
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="editData">Data</label>
                            <input type="date" id="editData" required>
                        </div>
                        <div class="form-group">
                            <label for="editOrario">Orario</label>
                            <input type="text" id="editOrario" placeholder="10:00 - 11:00" required>
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="editDurata">Durata</label>
                            <input type="text" id="editDurata" placeholder="1h" required>
                        </div>
                        <div class="form-group">
                            <label for="editPrezzo">Prezzo</label>
                            <input type="text" id="editPrezzo" placeholder="€25" required>
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="editStato">Stato</label>
                        <select id="editStato" required>
                            <option value="confermata">Confermata</option>
                            <option value="in-attesa">In Attesa</option>
                            <option value="annullata">Annullata</option>
                        </select>
                    </div>
                </form>
            </div>
            <div class="dialog-actions">
                <button class="dialog-btn btn-cancel" onclick="closeEditDialog()">Annulla</button>
                <button class="dialog-btn btn-confirm" onclick="confirmEdit()">Salva Modifiche</button>
            </div>
        </div>
    </div>

        <<-FOOTER->>
    </body>
</html>
