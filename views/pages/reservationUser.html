<!DOCTYPE html>
<html data-theme="light" lang="it">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<link href="../assets/logo_white.png" rel="icon" />
		<meta name="description" content="SportLab - Pagina di prenotazione" />
		<meta name="language" content="it" />
		<title>Prenota - SportLab</title>
		<link href="../style/style.css" rel="stylesheet" />
		<link href="../style/reservation.css" rel="stylesheet" />
		<link href="../style/header.css" rel="stylesheet" />
		<link href="../style/footer.css" rel="stylesheet" />
		<script src="../scripts/reservationUser.js"></script>
	</head>

	<body onload="renderTimetable()">
		<<-HEADER->>
		<div class="sr-only" id="breadcrumb-label">
			<span lang="en">breadcrumb</span>
		</div>
		<nav aria-labelledby="breadcrumb-label" id="breadcrumb">
			<p>Ti trovi in: <span class="breadcrumb-page">Prenota</span></p>
		</nav>
		<main id="main-content" class="main-user" tabindex="-1">
			<div class="info-container">

			<form class="info-form" action="../controller/reservationUserController.php" method="post">
				<div class="info-header">
					<h1>Prenota un campo!</h1>
				</div>
				<div class="form-separation">
					<div class="separation">
						<fieldset>
							<legend>1. Scegli lo sport</legend>
							<div class="sport-form">
								<label>
									<input
										type="radio"
										name="sport"
										value="Tennis"
										onclick="clearInput('tennis')"
										required />
									<img
										src="../assets/icon-tennis.png"
										alt=""
										aria-hidden="true" />
									<span class="visually-hidden">Tennis</span>
								</label>
								<label>
									<input
										type="radio"
										name="sport"
										value="Basket"
										onclick="clearInput('basket')" />
									<img
										src="../assets/icon-basketball.png"
										alt=""
										aria-hidden="true" />
									<span class="visually-hidden">Basket</span>
								</label>
								<label>
									<input
										type="radio"
										name="sport"
										value="Calcio5"
										onclick="clearInput('calcetto')" />
									<img
										src="../assets/icon-soccer.png"
										alt=""
										aria-hidden="true" />
									<span class="visually-hidden">Calcetto</span>
								</label>
							</div>
						</fieldset>
						<fieldset>
							<legend>2. Scegli il campo</legend>
							<div class="sport-form">
								<label class="campo-label">
									<input
										type="radio"
										name="campo"
										value="1"
										onclick="clearInput('none')"
										required />
									<p>1</p>
									<span class="visually-hidden">1</span>
								</label>
								<label class="campo-label">
									<input
										type="radio"
										name="campo"
										value="2"
										onclick="clearInput('none')" />
									<p>2</p>
									<span class="visually-hidden">2</span>
								</label>
								<label class="campo-label">
									<input
										type="radio"
										name="campo"
										value="3"
										onclick="clearInput('none')" />
									<p>3</p>
									<span class="visually-hidden">3</span>
								</label>
							</div>
						</fieldset>
						<fieldset>
							<legend>3. Scegli la data</legend>
							<div class="date-form">
								<label>
									<input
										id="date"
										type="date"
										name="date"
										value=""
										onchange="getReservations()"
										required />
									</label
								>
							</div>
						</fieldset>

						<fieldset>
							<legend>4. Scegli la fascia oraria</legend>
							<div class="timetable-form" id="timetable-container"></div>
						</fieldset>
					</div>
				</div>

				<input class="submit-button" type="submit" value="Conferma" />
			</form>
			</div>
		</main>

		<<-FOOTER->>
	</body>
</html>
